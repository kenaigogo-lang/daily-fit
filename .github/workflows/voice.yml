name: 產生語音

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data.js', 'tools/gen-voice.mjs']

permissions:
  contents: write
  pages: write

concurrency: voice

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 用 Azure 產生語音檔
        run: node tools/gen-voice.mjs
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      - name: 提交語音檔並更新網站
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then echo "語音檔沒有變動"; exit 0; fi
          git commit -m "更新語音檔"
          git pull --rebase && git push
          # 機器人推送不會自動觸發 Pages，手動要求重新部署
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
