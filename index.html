<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>每日10分鐘</title>
<meta name="description" content="護腰、強化核心與臀部的每日10分鐘健身助手">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="每日10分鐘">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>">
<style>
:root{
  --bg:#f4f6f5; --card:#ffffff; --ink:#18201e; --muted:#5d6b67; --line:#e1e7e4;
  --brand:#0f766e; --brand-ink:#ffffff; --brand-soft:#d6f0ec;
  --fire:#ea580c; --fire-soft:#ffedd5; --ok:#16a34a; --ok-soft:#dcfce7;
  --quick:#86c5bd; --warn:#b45309; --warn-soft:#fef3c7;
  --rest:#6366f1; --rest-soft:#e0e7ff;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1413; --card:#182120; --ink:#e8efed; --muted:#9aaba6; --line:#2a3633;
    --brand:#2dd4bf; --brand-ink:#062925; --brand-soft:#123a35;
    --fire:#fb923c; --fire-soft:#3b2414; --ok:#4ade80; --ok-soft:#133222;
    --quick:#1f6b62; --warn:#fbbf24; --warn-soft:#3a2e10;
    --rest:#a5b4fc; --rest-soft:#232a4d;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1413; --card:#182120; --ink:#e8efed; --muted:#9aaba6; --line:#2a3633;
  --brand:#2dd4bf; --brand-ink:#062925; --brand-soft:#123a35;
  --fire:#fb923c; --fire-soft:#3b2414; --ok:#4ade80; --ok-soft:#133222;
  --quick:#1f6b62; --warn:#fbbf24; --warn-soft:#3a2e10;
  --rest:#a5b4fc; --rest-soft:#232a4d;
  --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.55;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}
h1{font-size:22px;margin:0;letter-spacing:.5px}
h2{font-size:16px;margin:0 0 10px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;font-weight:700;background:var(--fire-soft);color:var(--fire);font-size:15px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:13px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px}
.btn{display:block;width:100%;padding:14px;font-size:17px;font-weight:700;background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.today-title{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.today-title .emo{font-size:30px}
.today-title b{font-size:19px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-weight:600;margin-right:4px}
.done-banner{background:var(--ok-soft);color:var(--ok);font-weight:700;padding:8px 12px;border-radius:10px;margin:10px 0;text-align:center}
ol.plan{margin:10px 0 14px;padding-left:22px}
ol.plan li{margin:3px 0}
ol.plan .amt{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink);font-size:14px}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week .d{font-size:12px;color:var(--muted)}
.week .dot{margin:4px auto 0;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;border:2px dashed var(--line)}
.week .dot.done{background:var(--ok);border:0;color:#fff}
.week .dot.quick{background:var(--quick);border:0;color:#fff}
.week .dot.today{border-color:var(--brand);border-style:solid}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:22px}
.stats span{font-size:12px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}
.cal .h{color:var(--muted);font-size:12px}
.cal .c{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;background:var(--bg)}
.cal .c.done{background:var(--ok);color:#fff;font-weight:700}
.cal .c.quick{background:var(--quick);color:#fff}
.cal .c.today{outline:2px solid var(--brand)}
.cal .c.empty{background:transparent}
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calnav button{background:var(--bg);color:var(--ink);padding:4px 12px;border:1px solid var(--line)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding:10px 6px 8px;border-radius:12px;background:var(--bg);font:inherit;font-size:12px;color:var(--muted);border:2px solid transparent;cursor:pointer}
.badge .i{font-size:30px;line-height:1.2;filter:grayscale(1);opacity:.35}
.badge b{font-size:13px;color:var(--ink);line-height:1.3}
.badge small{font-size:11px;line-height:1.3}
.badge .tn{font-weight:700}
.badge.got{border-color:var(--tc);background:var(--card);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 18%,transparent)}
.badge.got .i{filter:none;opacity:1}
.badge.got .tn{color:var(--tc)}
.pg{display:block;width:100%;height:5px;background:var(--line);border-radius:9px;overflow:hidden;margin:4px 0 2px}
.pg i{display:block;height:100%;background:var(--brand);border-radius:9px}
.pg.big{height:8px;margin:8px 0 12px}
.bhead{display:flex;justify-content:space-between;align-items:baseline}
.bgh{font-weight:700;font-size:14px;margin:14px 0 8px}
.goal{background:var(--brand-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheetbox{background:var(--card);color:var(--ink);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom));text-align:center;max-height:85vh;overflow:auto}
.sheetbox .big{font-size:52px}
.sheetbox h2{font-size:20px;margin:4px 0}
.tiers{list-style:none;padding:0;margin:12px 0 16px;text-align:left}
.tiers li{display:flex;align-items:center;gap:10px;padding:9px 4px;border-top:1px solid var(--line);opacity:.5}
.tiers li.ok{opacity:1}
.tiers li i{width:14px;height:14px;border-radius:50%;flex:none}
.tiers li b{width:3em}
.tiers li span{flex:1}
.tiers li small{color:var(--muted);font-size:12px}
/* 檳城之旅 */
.pill.sky{background:var(--rest-soft);color:var(--rest);font-size:13px;padding:4px 10px}
.tripmap{width:100%;height:auto;display:block;border-radius:12px}
.tripmap .bg{fill:var(--bg)}
.tripmap .n{font-size:10px;fill:var(--muted)}
.tripmap .route{fill:none;stroke:var(--line);stroke-width:3;stroke-dasharray:4 5;stroke-linecap:round}
.tripmap .walked{fill:none;stroke:var(--brand);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.tripmap circle{stroke-width:2}
.tripmap circle.got{fill:var(--card);stroke:var(--brand)}
.tripmap circle.nx{fill:var(--card);stroke:var(--fire);stroke-dasharray:3 2}
.tripmap circle.fut{fill:var(--card);stroke:var(--line)}
.tripmap .em{font-size:9px}
.tripmap .lb{font-size:10px;font-weight:700;fill:var(--ink)}
.tripmap .lb.q{fill:var(--muted);font-weight:400}
.tripmap .me{font-size:15px}
.tripmap .mapstop{cursor:pointer}
.tripstatus{margin-top:10px;font-size:14.5px}
.clues{list-style:none;padding:0;margin:8px 0 0;font-size:14px}
.clues li{background:var(--bg);border-radius:10px;padding:7px 10px;margin-bottom:6px}
.clues a,.fact a{color:var(--brand);font-weight:700}
.tripsheet{text-align:left}
.tripsheet h2{margin:6px 0 2px}
.tripsheet .big{text-align:center}
.tripphoto{width:100%;max-height:240px;object-fit:cover;border-radius:12px;display:block;background:var(--bg)}
.credit{font-size:11px;color:var(--muted);margin:4px 0 10px}
.credit a{color:var(--muted)}
.story p{font-size:15px;line-height:1.75;margin:10px 0}
.story .legend{background:var(--warn-soft);border-radius:10px;padding:8px 10px}
.ltag{display:inline-block;background:var(--warn);color:var(--card);font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-right:6px}
.fact{background:var(--bg);border-radius:10px;padding:9px 11px;margin-top:8px;font-size:14px}
.tipbox{background:var(--brand-soft)}
.favbtn{flex:1;padding:12px;border-radius:12px;font:inherit;font-weight:700;background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
.favbtn.on{background:var(--fire-soft);color:var(--fire);border-color:var(--fire)}
a.mapbtn{display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:15px;padding:12px}
.dcard{background:var(--bg);border-radius:12px;padding:12px;margin-top:8px;text-align:left}
.dcard p{margin:4px 0 10px;font-size:14.5px;line-height:1.65}
.dcard .favbtn{background:var(--card)}
.qopts{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.qopt{padding:12px;border-radius:12px;font:inherit;text-align:left;background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
.qopt.right{border-color:var(--ok);background:var(--ok-soft);font-weight:700}
.qopt.wrong{border-color:var(--fire);background:var(--fire-soft)}
.tripdone{margin-top:14px;text-align:left}
.arrive{display:flex;align-items:center;gap:12px;margin-top:10px;background:var(--brand-soft);border-radius:12px;padding:10px}
.arrive>div:nth-child(2){flex:1}
.stamp{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:26px;border:2.5px dashed var(--fire);color:var(--fire);transform:rotate(-8deg);flex:none;background:var(--card)}
.arrive .stamp{animation:stampin .5s ease-out}
@keyframes stampin{from{transform:scale(2.2) rotate(-25deg);opacity:0}}
.journal{padding:0 16px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;width:100%}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.stampcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:12px;background:var(--card);border:1px solid var(--line);font:inherit;font-size:13px;color:var(--muted);text-align:center}
.stampcard.got{color:var(--ink);cursor:pointer}
.stampcard:not(.got) .stamp{border-color:var(--line);color:var(--muted);transform:none}
.stampcard small{font-size:11px;color:var(--muted)}
.favrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.favrow>span{font-size:24px}
.favrow>div{flex:1;min-width:0}
.favrow small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.favrow .mapbtn{padding:8px 10px;font-size:13px;width:auto}
.favrow .x{background:none;color:var(--muted);font-size:16px;padding:6px}
.howto{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
.howto p{font-size:14px}
#tripov .bgh{margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:40;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:pop .3s ease-out}
@keyframes pop{from{transform:translate(-50%,20px);opacity:0}}
.lv{display:flex;gap:8px}
.lv button{flex:1;padding:10px 4px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-size:14px}
.lv button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.hint{background:var(--warn-soft);color:var(--warn);padding:10px 12px;border-radius:10px;font-size:14px;margin-top:10px}
details{border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
details:first-of-type{border-top:0;padding-top:0;margin-top:0}
summary{cursor:pointer;font-weight:700;padding:4px 0}
.why p,.why li{font-size:14.5px}
.why ul{padding-left:20px}
.switch{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch input{width:22px;height:22px;accent-color:var(--brand)}
textarea{width:100%;min-height:80px;font:12px monospace;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px}
svg.trend{width:100%;height:120px;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* workout overlay */
.ov{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column;overflow:auto}
.ov.show{display:flex}
.ov .top{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top))}
.ov .top button{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:8px 12px;font-size:14px}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 16px 16px;text-align:center;max-width:560px;margin:0 auto;width:100%}
.stage .kicker{font-size:14px;color:var(--muted);min-height:22px}
.stage .name{font-size:28px;font-weight:800;margin:4px 0 2px;line-height:1.25}
.stage .meta{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:26px}
.stage .meta .tag{font-size:13px}
.ring{position:relative;width:min(62vw,240px);aspect-ratio:1;margin:14px auto 10px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--brand);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring.rest .fg{stroke:var(--rest)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;font-weight:800;font-variant-numeric:tabular-nums}
.ring .num small{display:block;font-size:16px;font-weight:600;color:var(--muted);margin-top:-6px}
.cues{list-style:none;padding:0;margin:4px 0 12px;text-align:left;width:100%}
.cues li{padding:8px 12px 8px 34px;position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:15px}
.cues li::before{content:"✓";position:absolute;left:12px;color:var(--brand);font-weight:800}
.vid{width:100%;margin:10px 0 2px}
.vid .frame{width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.vid iframe{width:100%;height:100%;border:0;display:block}
.vid .src{font-size:12px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:8px}
.vid .src a{color:var(--brand)}
.vid .load{width:100%;padding:12px;background:var(--card);color:var(--brand);border:1.5px dashed var(--brand);font-weight:700}
.ring.compact{width:min(38vw,150px);margin:8px auto}
.ring.compact .num{font-size:44px}
.cues.bad li{background:var(--fire-soft);border-color:transparent}
.cues.bad li::before{content:"✗";color:var(--fire)}
.cuehead{width:100%;text-align:left;font-size:13px;font-weight:700;color:var(--muted);margin:2px 0 4px}
.band{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:8px 10px;border-radius:8px;margin-bottom:10px;width:100%;text-align:left}
.band .bw{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px;color:var(--ink);font-size:14px}
.sw{display:inline-flex;align-items:center;gap:5px;font-weight:700;white-space:nowrap}
.sw i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.sw small{font-weight:400;color:var(--muted);font-size:12px}
.gear{background:var(--warn-soft);border-radius:12px;padding:10px 12px;margin:0 0 14px;width:100%;text-align:left}
.gear .gh{font-weight:800;color:var(--warn);margin-bottom:4px}
.gear table{width:100%;border-collapse:collapse;font-size:14px}
.gear th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:4px 4px 2px}
.gear th.gt{color:var(--warn);padding-top:8px}
.gear td{padding:5px 4px;border-top:1px solid var(--line);vertical-align:middle}
.nextup{font-size:14px;color:var(--muted);margin-bottom:12px}
.ctrl{width:100%;display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px;margin-top:auto;position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.ctrl button{padding:16px 6px;font-size:16px;font-weight:700;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.ctrl .main{background:var(--brand);color:var(--brand-ink);border:0;font-size:18px}
.ctrl .main.restbtn{background:var(--rest);color:#fff}
.donebox{text-align:center;padding:24px 16px;max-width:560px;margin:0 auto;width:100%}
.donebox .big{font-size:64px}
.donebox h2{font-size:24px;margin:8px 0}
.pain{text-align:left;margin:18px 0}
.pain label{display:block;margin:12px 0 4px;font-weight:600}
.pain input[type=range]{width:100%;accent-color:var(--brand)}
.pain .v{float:right;color:var(--brand);font-weight:800}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:24px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.notice{background:var(--warn-soft);color:var(--warn);font-size:14px}
.notice b{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap" id="home"></div>

<div class="ov" id="ov">
  <div class="top">
    <button id="wQuit">✕ 結束</button>
    <div class="bar"><i id="wBar"></i></div>
    <span class="small muted" id="wCount"></span>
  </div>
  <div class="stage" id="wStage">
    <div class="kicker" id="wKicker"></div>
    <div class="name" id="wName"></div>
    <div class="meta" id="wMeta"></div>
    <div class="vid" id="wVid"></div>
    <div class="ring" id="wRing">
      <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" id="wArc" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="0"/></svg>
      <div class="num"><div><span id="wNum"></span><small id="wUnit"></small></div></div>
    </div>
    <div class="band" id="wBand" hidden></div>
    <div class="cuehead" id="wCueHead">動作要點</div>
    <ul class="cues" id="wCues"></ul>
    <div class="cuehead" id="wBadHead">⚠️ 常見錯誤</div>
    <ul class="cues bad" id="wBad"></ul>
    <div class="nextup" id="wNext"></div>
    <div class="ctrl">
      <button id="wPrev">⏮ 上一步</button>
      <button class="main" id="wMain"></button>
      <button id="wSkip">跳過 ⏭</button>
    </div>
  </div>
  <div class="donebox" id="wDone" hidden></div>
</div>

<div class="ov" id="tripov"></div>

<script src="data.js"></script>
<script src="penang.js"></script>
<script src="trip.js"></script>

}

/* ===================== 日期與統計 ===================== */
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
function dayMap(){ // date -> 'full' | 'quick'
  const m={};
  for(const l of S.logs){ if(!l.quick) m[l.date]='full'; else if(!m[l.date]) m[l.date]='quick'; }
  return m;
}
function stats(){
  const m=dayMap(), now=new Date();
  let cur=0, d=m[dkey(now)]?now:addDays(now,-1);
  while(m[dkey(d)]){ cur++; d=addDays(d,-1); }
  const days=Object.keys(m).sort(); let longest=0, run=0, prev=null;
  for(const k of days){ const dt=new Date(k+'T00:00'); run = prev && dkey(addDays(prev,1))===k ? run+1 : 1; longest=Math.max(longest,run); prev=dt; }
  const pains=S.logs.filter(l=>l.pain);
  let painHalved=false;
  if(pains.length>=6){
    const avg=a=>a.reduce((s,l)=>s+l.pain.back+l.pain.hip,0)/a.length;
    const first=avg(pains.slice(0,3)), last=avg(pains.slice(-3));
    painHalved = first>=2 && last<=first/2;
  }
  return {streak:cur,longest,total:S.logs.length,minutes:S.logs.reduce((s,l)=>s+(l.min||0),0),maxLevel:S.settings.maxLevel,painHalved,days:m};
}
// 徽章用的統計（從所有紀錄重算，所以舊紀錄也會算進去）
function badgeStats(){
  const st=stats(), days=Object.keys(st.days).sort(), set=new Set(days), weeks={}, months={};
  const day=k=>new Date(k+'T00:00');
  for(const k of days){
    const mon=dkey(addDays(day(k),-((day(k).getDay()+6)%7)));
    weeks[mon]=(weeks[mon]||0)+1; months[k.slice(0,7)]=(months[k.slice(0,7)]||0)+1;
  }
  let comebacks=0, weekends=0;
  for(let i=1;i<days.length;i++) if((day(days[i])-day(days[i-1]))/864e5>=4) comebacks++;
  for(const k of days) if(day(k).getDay()===6 && set.has(dkey(addDays(day(k),1)))) weekends++;
  const perDay={}, byRoutine={}; let early=0, late=0, quick=0;
  for(const l of S.logs){
    perDay[l.date]=(perDay[l.date]||0)+1; byRoutine[l.routine]=(byRoutine[l.routine]||0)+1;
    if(l.quick) quick++;
    const h=new Date(l.ts).getHours(); if(h<8) early++; if(h>=21) late++;
  }
  const pains=S.logs.filter(l=>l.pain);
  return {...st, byRoutine, early, late, quick, comebacks, weekends,
    perfectWeeks:Object.values(weeks).filter(n=>n>=7).length,
    goodMonths:Object.values(months).filter(n=>n>=20).length,
    doubleDays:Object.values(perDay).filter(n=>n>=2).length,
    distinct:['A','B','C','D','E'].filter(k=>byRoutine[k]).length,
    painLogs:pains.length, comfy:pains.filter(l=>l.pain.back<=1&&l.pain.hip<=1).length,
    ...(()=>{ const t=tripState(), q=tripQuiz();
      return {tripStops:t.arrived, tripCards:t.cards, tripQuiz:TRIP.stops.filter(s=>s.quiz&&q[s.id]===s.quiz.a).length}; })()};
}
// 把新達成的等級記下解鎖日期，回傳這次新拿到的 [{s, k}]（k = 第幾級，從 1 起算）
function syncBadges(){
  const b=badgeStats(), out=[]; S.badges=S.badges||{};
  for(const s of BADGE_SERIES){
    const n=tierCount(s,b);
    for(let k=1;k<=n;k++){ const key=s.id+':'+s.t[k-1]; if(!S.badges[key]){ S.badges[key]=dkey(new Date()); out.push({s,k}); } }
  }
  if(out.length) save();
  return out;
}

function topNew(list){

  return Object.values(m);
}

/* ===================== 課表展開 ===================== */
function buildSteps(rid,lv){
  const R=ROUTINES[rid], out=[];
  for(const b of R.blocks){
    const rounds=b.rounds||1;
    for(let r=1;r<=rounds;r++) for(const it of b.items){
      const ex=EX[it.ex], sets=it.sets||1, amt=scaled(it,lv);
      for(let s=1;s<=sets;s++) for(const side of ex.sided?['左邊','右邊']:[null]){
        out.push({kind:ex.kind,ex:it.ex,reps:amt.reps,sec:amt.sec,set:s,sets,side,round:r,rounds,uid:it});
      }
    }
  }
  // 插入休息
  const steps=[{kind:'rest',sec:5,label:'準備開始',next:out[0]}];
  out.forEach((st,i)=>{
    steps.push(st);
    const nx=out[i+1]; if(!nx) return;
    let sec=10,label='休息';
    if(nx.uid===st.uid && nx.set===st.set && nx.round===st.round){ sec=5; label='換邊'; }
    else if(nx.uid===st.uid){ sec=15; label='組間休息'; }
    steps.push({kind:'rest',sec,label,next:nx});
  });
  // 有用到彈力帶的課表，開始前先停在「準備器材」，按了才開始
  if(gearFor(rid).length) steps.unshift({kind:'gear',next:out[0]});
  return steps;
}
const isWork=st=>st.kind==='reps'||st.kind==='time';
function stepSeconds(st){
  if(st.kind==='gear') return 0;
  if(st.kind==='reps'){ const ex=EX[st.ex]; return st.reps*(ex.hold?ex.hold+2:3)+4; }
  return st.sec;
}
const estMin=steps=>Math.max(1,Math.round(steps.reduce((s,x)=>s+stepSeconds(x),0)/60));
function amtText(st){ return st.reps ? `${st.reps} 下` : `${st.sec} 秒`; }
// 彈力帶色塊：● 藍 10–12 磅
function swatch(type,c){ return `<span class="sw"><i style="background:${BAND_HEX[c]}"></i>${c}<small>${BANDS[type].lb[c]}</small></span>`; }
// 準備器材表：每個用到彈力帶的動作，男生／女生各拿哪條
function gearTable(rid,lv){
  const list=gearFor(rid); if(!list.length) return '';
  const rows=['loop','tube'].map(type=>{
    const items=list.filter(x=>x.g.type===type); if(!items.length) return '';
    return `<tr><th colspan="3" class="gt">${BANDS[type].full}</th></tr>`+items.map(x=>`<tr><td>${EX[x.ex].name}</td><td>${swatch(type,gearColor(x.g,'m',lv))}</td><td>${swatch(type,gearColor(x.g,'f',lv))}</td></tr>`).join('');
  }).join('');
  return `<div class="gear"><div class="gh">🎗️ 今天要準備的彈力帶</div><table><tr><th></th><th>👨 男生</th><th>👩 女生</th></tr>${rows}</table></div>`;
}
function planLines(rid,lv){
  const R=ROUTINES[rid], lines=[];
  for(const b of R.blocks){
    const head = b.rounds>1 ? `【循環 ${b.rounds} 輪】` : '';
    b.items.forEach((it,j)=>{
      const ex=EX[it.ex], a=scaled(it,lv);
      let t=(a.reps?`${a.reps} 下`:`${a.sec} 秒`)+(ex.hold?`（每下停 ${ex.hold} 秒）`:'');
      if(ex.sided) t+=' ・左右各一';
      if(it.sets>1) t+=` × ${it.sets} 組`;
      lines.push(`${j===0?head:''}${ex.emoji} ${ex.name}<span class="amt">　${t}</span>`);
    });
  }
  return lines;
}

/* ===================== 音效 / 語音 / 螢幕常亮 ===================== */
let actx=null, wakeLock=null;
function beep(f=880,d=.12){
  if(!S.settings.sound) return;
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume();
    const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
    o.frequency.value=f; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(.3,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.start(t); o.stop(t+d);
  }catch(e){}
}
// 優先挑台灣女聲：Edge 的 HsiaoChen/HsiaoYu（自然語音）、Windows 的 Hanhan/Yating、iPhone 的美佳、Android 的 Google 國語（臺灣）
const TW_FEMALE=/HsiaoChen|HsiaoYu|曉臻|曉雨|Hanhan|Yating|Mei-?Jia|美佳|Google.*(臺灣|台灣|Taiwan)/i;
const TW_MALE=/Zhiwei|YunJhe|Yun-?Jhe|志偉|雲哲/i;
const isTW=v=>/zh[-_]TW|cmn[-_]Hant[-_]TW/i.test(v.lang);
function zhVoices(){
  try{ return speechSynthesis.getVoices().filter(v=>/^(zh|cmn|yue)/i.test(v.lang)); }catch(e){ return []; }
}
function rankVoice(v){
  return (isTW(v)?100:0)+(TW_FEMALE.test(v.name)?50:0)-(TW_MALE.test(v.name)?80:0)+(/Natural|Online|Neural|Premium|Enhanced/i.test(v.name)?20:0);
}
function pickVoice(){
  const vs=zhVoices();
  if(S.settings.voiceName&&S.settings.voiceName!==HQ){ const v=vs.find(x=>x.name===S.settings.voiceName); if(v) return v; }
  return vs.sort((a,b)=>rankVoice(b)-rankVoice(a))[0]||null;
}
// 高品質語音：Azure 曉臻預先做好的 mp3（audio/），沒有對應音檔時改用裝置內建語音
const HQ='__hq__';
let voiceFiles=new Set();
fetch('audio/manifest.json').then(r=>r.ok?r.json():[]).then(a=>{ voiceFiles=new Set(a); fillVoiceSelect(); }).catch(()=>{});
const useHQ=()=>(!S.settings.voiceName||S.settings.voiceName===HQ);
const audioEl=new Audio(); let audioQueue=[];
audioEl.onended=playNextClip;
function playNextClip(){
  const f=audioQueue.shift(); if(!f) return;
  const r=S.settings.rate/1.3; // 音檔本身已加快 15%，預設語速 1.3 = 原速播放
  audioEl.src=f; audioEl.defaultPlaybackRate=r; audioEl.playbackRate=r;
  audioEl.play().catch(()=>{});
}
function stopSpeech(){
  audioQueue=[]; try{ audioEl.pause(); }catch(e){}
  try{ speechSynthesis.cancel(); }catch(e){}
}
// parts：要依序講的句子（每句都有對應音檔時播音檔）
function say(parts){
  if(!S.settings.voice) return;
  parts=[].concat(parts).filter(Boolean);
  stopSpeech();
  if(useHQ() && parts.every(p=>voiceFiles.has(voiceFile(p)))){ audioQueue=parts.map(voiceFile); playNextClip(); return; }
  if(!('speechSynthesis' in window)) return;
  try{
    const u=new SpeechSynthesisUtterance(parts.join('，')), v=pickVoice();
    if(v){ u.voice=v; u.lang=v.lang; } else u.lang='zh-TW';
    u.rate=S.settings.rate; speechSynthesis.speak(u);
  }catch(e){}
}
// 先把這次課表會用到的音檔載進快取，播放時就不會卡頓
function preloadVoice(steps){
  if(!useHQ()||!voiceFiles.size) return;
  const lines=new Set([DONE_LINE,restLine(null,true)]);
  for(const st of steps){
    if(st.kind==='gear'){ lines.add(gearLine(W.rid,W.lv)); continue; }
    if(st.kind==='rest'){ lines.add(restLine(st.label)); continue; }
    const ex=EX[st.ex]; lines.add(ex.name); lines.add(amtLine(st)); lines.add(cueLine(ex));
    if(st.side) lines.add(st.side); if(ex.hold) lines.add(holdLine(ex.hold));
  }
  lines.forEach(l=>{ const f=voiceFile(l); if(voiceFiles.has(f)) fetch(f).catch(()=>{}); });
}
// 語音清單是非同步載入的，載好後更新設定頁的下拉選單
try{ speechSynthesis.onvoiceschanged=()=>{ if(!W) fillVoiceSelect(); }; }catch(e){}
function fillVoiceSelect(){
  const sel=document.getElementById('voiceSel'); if(!sel) return;
  const vs=zhVoices().sort((a,b)=>rankVoice(b)-rankVoice(a)), cur=useHQ()?null:pickVoice();
  const hq=voiceFiles.size?`<option value="${HQ}" ${useHQ()?'selected':''}>🌟 曉臻（自然語音・推薦）</option>`:'';
  sel.innerHTML=hq+vs.map(v=>`<option value="${v.name}" ${cur&&cur.name===v.name?'selected':''}>${v.name}（${v.lang}）</option>`).join('')||'<option>這個瀏覽器沒有中文語音</option>';
}
async function keepAwake(on){
  try{
    if(on && 'wakeLock' in navigator){ wakeLock=await navigator.wakeLock.request('screen'); }
    else if(!on && wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(W && document.visibilityState==='visible') keepAwake(true); });

/* ===================== 訓練流程 ===================== */
let W=null, timer=null;
const $=id=>document.getElementById(id);
const ARC=276.46;
function startWorkout(rid){
  beep(660,.05); // 解鎖 iOS 音效
  const lv=S.settings.level;
  W={rid,lv,steps:buildSteps(rid,lv),i:0,startedAt:Date.now(),running:false,endAt:0,left:0,paused:false,cued:new Set()};
  $('ov').classList.add('show'); $('wStage').hidden=false; $('wDone').hidden=true;
  document.body.style.overflow='hidden';
  keepAwake(true);
  preloadVoice(W.steps);
  enter(0);
  clearInterval(timer); timer=setInterval(tick,200);
}
function stepTitle(st){ return `${EX[st.ex].name}${st.side?'・'+st.side:''}`; }
function enter(i){
  W.i=i; const st=W.steps[i]; W.paused=false;
  if(st.kind==='reps'||st.kind==='gear'){ W.running=false; }
  else { W.running=true; W.total=st.sec; W.endAt=Date.now()+st.sec*1000; W.left=st.sec; }
  if(st.kind==='gear'){
    say(gearLine(W.rid,W.lv));
  } else if(st.kind==='rest'){
    say([restLine(st.label,st.label==='準備開始'),EX[st.next.ex].name,st.next.side]);
  } else {
    const ex=EX[st.ex], parts=[ex.name,st.side,amtLine(st),ex.hold&&holdLine(ex.hold)];
    // 動作要點每個動作只講一次（換邊、下一組、下一輪不重複）
    if(S.settings.cueVoice && !W.cued.has(st.ex)){ W.cued.add(st.ex); parts.push(cueLine(ex)); }
    say(parts);
    beep(990,.15);
  }
  render();
}
function tick(){
  if(!W||!W.running||W.paused) return;
  const ms=W.endAt-Date.now(), left=Math.ceil(ms/1000);
  if(left!==W.left){ W.left=left; if(left>0&&left<=3) beep(left===1?880:660,.1); if(navigator.vibrate&&left===0) navigator.vibrate(200); }
  if(ms<=0){ beep(1200,.3); next(); return; }
  renderTimer(ms);
}
function next(){ if(W.i+1>=W.steps.length) finish(); else enter(W.i+1); }
function prev(){
  let j=W.i-1; while(j>0 && W.steps[j].kind==='rest') j--;
  enter(Math.max(0,j));
}
function togglePause(){
  if(W.paused){ W.endAt=Date.now()+W.pausedMs; W.paused=false; }
  else { W.pausedMs=W.endAt-Date.now(); W.paused=true; }
  render();
}
function renderTimer(ms){
  const frac=Math.max(0,ms)/(W.total*1000);
  $('wArc').style.strokeDashoffset=String(ARC*(1-frac));
  $('wNum').textContent=Math.max(0,Math.ceil(ms/1000));
}
function render(){
  const st=W.steps[W.i], work=W.steps.filter(isWork).length;
  const doneWork=W.steps.slice(0,W.i).filter(isWork).length;
  $('wBar').style.width=(W.i/(W.steps.length-1)*100)+'%';
  $('wCount').textContent=`${Math.min(work,doneWork+(isWork(st)?1:0))}/${work}`;
  if(st.kind==='gear'){
    killPlayer(); W.vid=null; $('wVid').innerHTML='';
    $('wRing').hidden=true; $('wRing').classList.remove('compact');
    $('wKicker').textContent='開始前'; $('wName').textContent='🎗️ 準備器材'; $('wMeta').innerHTML='';
    $('wBand').className=''; $('wBand').hidden=false; $('wBand').innerHTML=gearTable(W.rid,W.lv);
    $('wCueHead').hidden=true; $('wBadHead').hidden=true; $('wCues').innerHTML=''; $('wBad').innerHTML='';
    $('wNext').textContent=`第一個動作：${EX[st.next.ex].emoji} ${stepTitle(st.next)}`;
    $('wMain').textContent='準備好了 ▶ 開始'; $('wMain').className='main';
    $('wSkip').textContent='跳過 ⏭'; $('wPrev').disabled=true;
    return;
  }
  $('wRing').hidden=false; $('wCueHead').hidden=false; $('wBand').className='band';
  const isRest=st.kind==='rest', ex=EX[isRest?st.next.ex:st.ex], ref=isRest?st.next:st;
  $('wRing').classList.toggle('rest',isRest);
  $('wKicker').textContent=isRest?`${st.label} ・ 下一個`:(ref.rounds>1?`第 ${ref.round}/${ref.rounds} 輪`:'');
  $('wName').textContent=`${ex.emoji} ${ex.name}`;
  const meta=[];
  if(ref.side) meta.push(ref.side);
  if(ref.sets>1) meta.push(`第 ${ref.set}/${ref.sets} 組`);
  if(ex.variants) meta.push(ex.variants[W.lv]);
  if(isRest) meta.push(amtText(ref));
  if(ex.hold) meta.push(`每下停 ${ex.hold} 秒`);
  $('wMeta').innerHTML=meta.map(m=>`<span class="tag">${m}</span>`).join('');
  if(st.kind==='reps'){
    $('wArc').style.strokeDashoffset='0';
    $('wNum').textContent=st.reps; $('wUnit').textContent='下';
    $('wMain').textContent='完成 ✓ 下一個'; $('wMain').className='main';
  } else {
    $('wUnit').textContent=isRest?'秒後開始':'秒';
    renderTimer(W.paused?W.pausedMs:W.endAt-Date.now());
    $('wMain').textContent=W.paused?'▶ 繼續':'⏸ 暫停';
    $('wMain').className='main'+(isRest?' restbtn':'');
  }
  $('wSkip').textContent=isRest?'開始 ⏭':'跳過 ⏭';
  $('wPrev').disabled=W.i===0;
  const g=ex.gear;
  if(g){
    $('wBand').hidden=false;
    $('wBand').innerHTML=`🎗️ ${BANDS[g.type].full}・${g.how}<div class="bw"><span>👨 ${swatch(g.type,gearColor(g,'m',W.lv))}</span><span>👩 ${swatch(g.type,gearColor(g,'f',W.lv))}</span></div>`;
  } else $('wBand').hidden=true;
  $('wCues').innerHTML=ex.cues.map(c=>`<li>${c}</li>`).join('')+(ex.why?`<li style="background:var(--brand-soft)">${ex.why}</li>`:'');
  const bad=BAD[isRest?st.next.ex:st.ex]||[];
  $('wBadHead').hidden=!bad.length; $('wBad').innerHTML=bad.map(c=>`<li>${c}</li>`).join('');
  renderVideo(isRest?st.next.ex:st.ex);
  const nx=W.steps.slice(W.i+1).find(isWork);
  $('wNext').textContent=isRest?'':(nx?`接下來：${EX[nx.ex].emoji} ${stepTitle(nx)}`:'這是最後一個動作，加油！');
}
// 同一支影片（例如換邊、下一組）不重新載入，避免一直重播
function renderVideo(exId){
  const d=pickLv(DEMO[exId],W.lv), box=$('wVid'), name=EX[exId].name;
  const key=d?d.yt+':'+(d.s||0):'none:'+exId;
  $('wRing').classList.toggle('compact',!!d);
  if(W.vid===key) return;
  W.vid=key; killPlayer();
  if(!d){
    box.innerHTML=`<div class="src"><span></span><a href="https://www.youtube.com/results?search_query=${encodeURIComponent(name+' 示範')}" target="_blank" rel="noopener">在 YouTube 搜尋「${name}」示範 ↗</a></div>`;
    return;
  }
  const foot=`<div class="src"><span>示範：${d.by}</span><a href="https://www.youtube.com/watch?v=${d.yt}&t=${d.s||0}s" target="_blank" rel="noopener">在 YouTube 開啟 ↗</a></div>`;
  if(S.settings.video){ box.innerHTML=`<div class="frame"><div id="ytp"></div></div>${foot}`; mountPlayer(d,key); }
  else {
    box.innerHTML=`<button class="load" id="vidBtn">▶ 看「${name}」示範影片</button>${foot}`;
    $('vidBtn').onclick=()=>{ $('vidBtn').outerHTML='<div class="frame"><div id="ytp"></div></div>'; mountPlayer(d,key); };
  }
}
// 用 YouTube IFrame API 播放，才能只循環影片中的某一段
let ytReady=null, player=null, segTimer=null;
function loadYT(){
  if(!ytReady) ytReady=new Promise(res=>{ window.onYouTubeIframeAPIReady=res;
    const sc=document.createElement('script'); sc.src='https://www.youtube.com/iframe_api'; document.head.appendChild(sc); });
  return ytReady;
}
async function mountPlayer(d,key){
  await loadYT();
  if(!W||W.vid!==key||!$('ytp')) return;
  const s=d.s||0;
  player=new YT.Player('ytp',{host:'https://www.youtube-nocookie.com',videoId:d.yt,
    playerVars:{autoplay:1,mute:1,playsinline:1,rel:0,modestbranding:1,start:s,end:d.e},
    events:{
      onReady:e=>{ e.target.mute(); e.target.playVideo(); },
      onStateChange:e=>{ if(e.data===YT.PlayerState.ENDED){ e.target.seekTo(s,true); e.target.playVideo(); } }
    }});
  const p=player;
  if(d.e) segTimer=setInterval(()=>{ try{ if(p.getCurrentTime()>=d.e) p.seekTo(s,true); }catch(err){} },500);
}
function killPlayer(){
  clearInterval(segTimer); segTimer=null;
  if(player){ try{ player.destroy(); }catch(e){} player=null; }
}
function stopWorkout(){
  clearInterval(timer); killPlayer(); W=null; keepAwake(false); $('wVid').innerHTML='';
  stopSpeech();
  $('ov').classList.remove('show'); document.body.style.overflow='';
  renderHome();
}
function finish(){
  killPlayer();
  clearInterval(timer);
  const R=ROUTINES[W.rid], min=Math.max(1,Math.round((Date.now()-W.startedAt)/60000));
  syncBadges(); // 先補記之前就達成的，這次只顯示真正新拿到的
  const stepsBefore=tripSteps();
  const log={date:dkey(new Date()),ts:Date.now(),routine:W.rid,min,level:W.lv,quick:!!R.quick};
  S.logs.push(log); save();
  const after=stats(), stepsAfter=tripSteps();
  const newBadges=syncBadges();
  keepAwake(false);
  say(DONE_LINE);
  $('wStage').hidden=true;
  const d=$('wDone'); d.hidden=false;
  d.innerHTML=`<div class="big">🎉</div><h2>${R.name} 完成！</h2>
    <p>${CHEERS[Math.floor(Math.random()*CHEERS.length)]}</p>
    <div class="pill" style="font-size:18px">🔥 連續 ${after.streak} 天</div>
    ${tripFinishBlock(stepsBefore,stepsAfter)}
    ${newBadges.length?`<div class="card" style="margin-top:14px"><b>🏅 獲得新徽章！</b><div class="badges" style="margin-top:8px">${newBadgeTiles(newBadges)}</div></div>`:''}
    <div class="pain card">
      <b>現在的痠痛程度？</b> <span class="small muted">（0 = 完全不痠，10 = 非常痛）</span>
      <label>腰／尾椎附近 <span class="v" id="pbv">2</span></label>
      <input type="range" min="0" max="10" value="2" id="pb" oninput="$('pbv').textContent=this.value">
      <label>屁股上緣外側 <span class="v" id="phv">2</span></label>
      <input type="range" min="0" max="10" value="2" id="ph" oninput="$('phv').textContent=this.value">
    </div>
    <button class="btn" onclick="savePain(${log.ts})">記錄並回首頁</button>
    <button class="btn ghost" style="margin-top:10px" onclick="stopWorkout()">略過</button>`;
  confetti();
}
function savePain(ts){
  const l=S.logs.find(x=>x.ts===ts);
  if(l){ l.pain={back:+$('pb').value,hip:+$('ph').value}; save(); }
  const nb=syncBadges(); // 記錄痠痛也可能解鎖徽章（自我觀察家、舒服的一天…）
  stopWorkout();
  if(nb.length) toast('🏅 獲得新徽章！'+topNew(nb).map(({s,k})=>`<div>${s.i} ${s.n}・${TIER_NAMES[k-1]}</div>`).join(''));
}
function confetti(){
  const box=document.createElement('div'); box.className='confetti';
  const em=['🎉','✨','💪','🔥','⭐','🟢','🟡','🔵'];
  for(let i=0;i<50;i++){ const s=document.createElement('span'); s.textContent=em[i%em.length];
    s.style.left=Math.random()*100+'vw'; s.style.animationDuration=(1.8+Math.random()*1.8)+'s'; s.style.animationDelay=(Math.random()*.6)+'s'; box.appendChild(s); }
  document.body.appendChild(box); setTimeout(()=>box.remove(),4500);
}
$('wMain').onclick=()=>{ const st=W.steps[W.i]; if(st.kind==='reps'||st.kind==='gear') next(); else togglePause(); };
$('wSkip').onclick=()=>next();
$('wPrev').onclick=()=>prev();
$('wQuit').onclick=()=>{ if(confirm('要結束嗎？沒做完不會記錄到今天的成績喔')) stopWorkout(); };

renderHome();
</script>
