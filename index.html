<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>每日10分鐘</title>
<meta name="description" content="護腰、強化核心與臀部的每日10分鐘健身助手">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="每日10分鐘">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>">
<style>
:root{
  --bg:#f4f6f5; --card:#ffffff; --ink:#18201e; --muted:#5d6b67; --line:#e1e7e4;
  --brand:#0f766e; --brand-ink:#ffffff; --brand-soft:#d6f0ec;
  --fire:#ea580c; --fire-soft:#ffedd5; --ok:#16a34a; --ok-soft:#dcfce7;
  --quick:#86c5bd; --warn:#b45309; --warn-soft:#fef3c7;
  --rest:#6366f1; --rest-soft:#e0e7ff;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1413; --card:#182120; --ink:#e8efed; --muted:#9aaba6; --line:#2a3633;
    --brand:#2dd4bf; --brand-ink:#062925; --brand-soft:#123a35;
    --fire:#fb923c; --fire-soft:#3b2414; --ok:#4ade80; --ok-soft:#133222;
    --quick:#1f6b62; --warn:#fbbf24; --warn-soft:#3a2e10;
    --rest:#a5b4fc; --rest-soft:#232a4d;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1413; --card:#182120; --ink:#e8efed; --muted:#9aaba6; --line:#2a3633;
  --brand:#2dd4bf; --brand-ink:#062925; --brand-soft:#123a35;
  --fire:#fb923c; --fire-soft:#3b2414; --ok:#4ade80; --ok-soft:#133222;
  --quick:#1f6b62; --warn:#fbbf24; --warn-soft:#3a2e10;
  --rest:#a5b4fc; --rest-soft:#232a4d;
  --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.55;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}
h1{font-size:22px;margin:0;letter-spacing:.5px}
h2{font-size:16px;margin:0 0 10px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;font-weight:700;background:var(--fire-soft);color:var(--fire);font-size:15px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:13px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px}
.btn{display:block;width:100%;padding:14px;font-size:17px;font-weight:700;background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.today-title{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.today-title .emo{font-size:30px}
.today-title b{font-size:19px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-weight:600;margin-right:4px}
.done-banner{background:var(--ok-soft);color:var(--ok);font-weight:700;padding:8px 12px;border-radius:10px;margin:10px 0;text-align:center}
ol.plan{margin:10px 0 14px;padding-left:22px}
ol.plan li{margin:3px 0}
ol.plan .amt{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink);font-size:14px}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week .d{font-size:12px;color:var(--muted)}
.week .dot{margin:4px auto 0;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;border:2px dashed var(--line)}
.week .dot.done{background:var(--ok);border:0;color:#fff}
.week .dot.quick{background:var(--quick);border:0;color:#fff}
.week .dot.today{border-color:var(--brand);border-style:solid}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:22px}
.stats span{font-size:12px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}
.cal .h{color:var(--muted);font-size:12px}
.cal .c{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;background:var(--bg)}
.cal .c.done{background:var(--ok);color:#fff;font-weight:700}
.cal .c.quick{background:var(--quick);color:#fff}
.cal .c.today{outline:2px solid var(--brand)}
.cal .c.empty{background:transparent}
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calnav button{background:var(--bg);color:var(--ink);padding:4px 12px;border:1px solid var(--line)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.badge{text-align:center;padding:10px 4px;border-radius:12px;background:var(--bg);font-size:12px;color:var(--muted)}
.badge .i{font-size:28px;display:block;filter:grayscale(1);opacity:.35}
.badge.got{background:var(--fire-soft);color:var(--ink)}
.badge.got .i{filter:none;opacity:1}
.lv{display:flex;gap:8px}
.lv button{flex:1;padding:10px 4px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-size:14px}
.lv button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.hint{background:var(--warn-soft);color:var(--warn);padding:10px 12px;border-radius:10px;font-size:14px;margin-top:10px}
details{border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
details:first-of-type{border-top:0;padding-top:0;margin-top:0}
summary{cursor:pointer;font-weight:700;padding:4px 0}
.why p,.why li{font-size:14.5px}
.why ul{padding-left:20px}
.switch{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch input{width:22px;height:22px;accent-color:var(--brand)}
textarea{width:100%;min-height:80px;font:12px monospace;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px}
svg.trend{width:100%;height:120px;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* workout overlay */
.ov{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column;overflow:auto}
.ov.show{display:flex}
.ov .top{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top))}
.ov .top button{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:8px 12px;font-size:14px}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 16px 16px;text-align:center;max-width:560px;margin:0 auto;width:100%}
.stage .kicker{font-size:14px;color:var(--muted);min-height:22px}
.stage .name{font-size:28px;font-weight:800;margin:4px 0 2px;line-height:1.25}
.stage .meta{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:26px}
.stage .meta .tag{font-size:13px}
.ring{position:relative;width:min(62vw,240px);aspect-ratio:1;margin:14px auto 10px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--brand);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring.rest .fg{stroke:var(--rest)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;font-weight:800;font-variant-numeric:tabular-nums}
.ring .num small{display:block;font-size:16px;font-weight:600;color:var(--muted);margin-top:-6px}
.cues{list-style:none;padding:0;margin:4px 0 12px;text-align:left;width:100%}
.cues li{padding:8px 12px 8px 34px;position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:15px}
.cues li::before{content:"✓";position:absolute;left:12px;color:var(--brand);font-weight:800}
.vid{width:100%;margin:10px 0 2px}
.vid .frame{width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.vid iframe{width:100%;height:100%;border:0;display:block}
.vid .src{font-size:12px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:8px}
.vid .src a{color:var(--brand)}
.vid .load{width:100%;padding:12px;background:var(--card);color:var(--brand);border:1.5px dashed var(--brand);font-weight:700}
.ring.compact{width:min(38vw,150px);margin:8px auto}
.ring.compact .num{font-size:44px}
.cues.bad li{background:var(--fire-soft);border-color:transparent}
.cues.bad li::before{content:"✗";color:var(--fire)}
.cuehead{width:100%;text-align:left;font-size:13px;font-weight:700;color:var(--muted);margin:2px 0 4px}
.band{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:8px;margin-bottom:10px}
.nextup{font-size:14px;color:var(--muted);margin-bottom:12px}
.ctrl{width:100%;display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px;margin-top:auto;position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.ctrl button{padding:16px 6px;font-size:16px;font-weight:700;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.ctrl .main{background:var(--brand);color:var(--brand-ink);border:0;font-size:18px}
.ctrl .main.restbtn{background:var(--rest);color:#fff}
.donebox{text-align:center;padding:24px 16px;max-width:560px;margin:0 auto;width:100%}
.donebox .big{font-size:64px}
.donebox h2{font-size:24px;margin:8px 0}
.pain{text-align:left;margin:18px 0}
.pain label{display:block;margin:12px 0 4px;font-weight:600}
.pain input[type=range]{width:100%;accent-color:var(--brand)}
.pain .v{float:right;color:var(--brand);font-weight:800}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:24px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.notice{background:var(--warn-soft);color:var(--warn);font-size:14px}
.notice b{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap" id="home"></div>

<div class="ov" id="ov">
  <div class="top">
    <button id="wQuit">✕ 結束</button>
    <div class="bar"><i id="wBar"></i></div>
    <span class="small muted" id="wCount"></span>
  </div>
  <div class="stage" id="wStage">
    <div class="kicker" id="wKicker"></div>
    <div class="name" id="wName"></div>
    <div class="meta" id="wMeta"></div>
    <div class="vid" id="wVid"></div>
    <div class="ring" id="wRing">
      <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" id="wArc" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="0"/></svg>
      <div class="num"><div><span id="wNum"></span><small id="wUnit"></small></div></div>
    </div>
    <div class="band" id="wBand" hidden></div>
    <div class="cuehead">動作要點</div>
    <ul class="cues" id="wCues"></ul>
    <div class="cuehead" id="wBadHead">⚠️ 常見錯誤</div>
    <ul class="cues bad" id="wBad"></ul>
    <div class="nextup" id="wNext"></div>
    <div class="ctrl">
      <button id="wPrev">⏮ 上一步</button>
      <button class="main" id="wMain"></button>
      <button id="wSkip">跳過 ⏭</button>
    </div>
  </div>
  <div class="donebox" id="wDone" hidden></div>
</div>

<script>
/* ===================== 動作庫 ===================== */
// kind: reps = 做完自己按下一個；time = 自動倒數。sided = 左右各做一次。hold = 每下停幾秒
const EX = {
  catcow:{name:'貓牛式',emoji:'🐈',kind:'time',cues:['四足跪姿：手在肩膀下、膝蓋在髖關節下','吸氣抬頭、腰往下沉；吐氣拱背、低頭','慢慢做，只在不痛的範圍內活動'],why:'喚醒脊椎，緩解久坐僵硬'},
  hipflexor:{name:'跪姿髖屈肌伸展',emoji:'🧎',kind:'time',sided:true,cues:['單膝跪地（膝下墊毛巾），另一腳在前','先夾緊屁股、骨盆微微往後捲，再把身體往前推','鼠蹊到大腿前側有拉感即可，腰不要拱'],why:'久坐會讓髖屈肌變緊，拉扯下背'},
  figure4:{name:'仰躺 4 字臀部伸展',emoji:'4️⃣',kind:'time',sided:true,cues:['仰躺，一腳腳踝放到另一腳膝蓋上','雙手抱住下方大腿，往胸口拉','屁股外側有拉感，放鬆呼吸'],why:'放鬆臀部外側、梨狀肌'},
  hamstring:{name:'彈力繩大腿後側伸展',emoji:'🦵',kind:'time',sided:true,band:'FE002 長彈力繩套腳底',cues:['仰躺，繩子套在腳底，膝蓋伸直往上拉','另一腳平放地面','大腿後側有拉感就好，不要硬拉'],why:'大腿後側太緊會牽動骨盆與下背'},
  doorway:{name:'門框胸肌伸展',emoji:'🚪',kind:'time',cues:['前臂貼門框，手肘和肩膀同高','身體往前跨一步，胸前有拉感','肩膀放鬆不要聳肩'],why:'打開久坐造成的圓肩'},
  curlup:{name:'McGill 捲腹',emoji:'🫁',kind:'reps',hold:8,cues:['仰躺，一腳彎曲一腳伸直，雙手墊在下背','頭和肩膀「微微」離地，停 8 秒','脖子不動，腰不要壓平也不要拱起'],why:'護腰版捲腹，不會反覆彎折腰椎'},
  sideplank:{name:'側棒式',emoji:'📐',kind:'time',sided:true,variants:['膝蓋著地版','直腿版','直腿版'],cues:['手肘在肩膀正下方','頭、身體到膝（或腳）成一直線','屁股不要往後坐，也不要往下垂'],why:'強化側腹與臀中肌，穩定骨盆'},
  birddog:{name:'鳥狗式',emoji:'🐕',kind:'reps',sided:true,hold:5,cues:['四足跪姿，背部保持平','同時伸出對側的手與腳，停 5 秒再收回','想像背上放一杯水不能灑出來'],why:'練背部與核心的穩定，閃腰族必備'},
  deadbug:{name:'死蟲式',emoji:'🪲',kind:'reps',cues:['仰躺，手朝天花板、膝蓋彎 90 度抬起','下背輕貼地面，慢慢伸出對側手腳','左右交替算一下；下背離地就縮小動作'],why:'練深層核心，同時保護下背'},
  plank:{name:'棒式',emoji:'🧱',kind:'time',cues:['手肘在肩膀下，身體成一直線','收小腹、夾屁股，不塌腰不翹臀','正常呼吸，不要憋氣'],why:'前側核心耐力'},
  glutebridge:{name:'臀橋',emoji:'🌉',kind:'reps',cues:['仰躺屈膝，腳跟靠近屁股','用屁股把骨盆推起，頂端停 1 秒','是屁股出力，不是用腰拱起來'],why:'喚醒久坐「失憶」的臀大肌'},
  bandbridge:{name:'彈力圈臀橋外撐',emoji:'🌉',kind:'reps',band:'FA020 彈力圈套膝蓋上方（先用黃色）',cues:['彈力圈套在膝蓋上方','膝蓋持續往外撐住圈，再推起屁股','頂端停 2 秒，感受屁股外側出力'],why:'同時練臀大肌＋臀中肌'},
  clamshell:{name:'彈力圈蚌殼式',emoji:'🐚',kind:'reps',sided:true,band:'FA020 彈力圈套膝蓋上方（太難就換藍色）',cues:['側躺，髖與膝彎約 45 度，圈套膝上','腳跟貼在一起，上面的膝蓋往上打開','骨盆不要往後翻，慢慢放下'],why:'直接強化臀中肌——就是你屁股上緣外側痠的位置'},
  sidelegraise:{name:'側躺抬腿',emoji:'🦩',kind:'reps',sided:true,cues:['側躺，下面的腳彎曲，上面的腳伸直、略往後','腳尖朝前（不要朝天花板）','用屁股外側把腿抬到約 45 度，停 1 秒'],why:'臀中肌主力訓練'},
  monsterwalk:{name:'彈力圈側走',emoji:'🦀',kind:'time',band:'FA020 彈力圈套膝上（簡單）或腳踝上（難）',cues:['微蹲、背打直','往側邊走 8～10 步，再走回來','膝蓋不要往內夾，步伐小而穩'],why:'臀中肌＋骨盆穩定'},
  squat:{name:'深蹲',emoji:'🏋️',kind:'reps',cues:['腳與肩同寬，腳尖微朝外','屁股往後坐，膝蓋和腳尖同方向','蹲到不痛的深度，站起時夾屁股'],why:'下肢基礎力量'},
  pushup:{name:'伏地挺身',emoji:'💪',kind:'reps',variants:['跪膝版或標準版皆可','標準版','標準版（可放慢下降 3 秒）'],cues:['手略寬於肩，身體成一直線','下降時手肘約 45 度，不要往外開','核心收緊，腰不要塌'],why:'上肢推力＋核心'},
  bandrow:{name:'彈力繩划船',emoji:'🚣',kind:'reps',band:'FE002 長彈力繩：中段繞門把或踩在腳下',cues:['雙手各握一端，站穩','手肘往後拉，肩胛骨往中間夾','慢慢放回，不要聳肩'],why:'強化上背，對抗久坐駝背'},
  pallof:{name:'彈力繩抗旋轉推',emoji:'🛡️',kind:'reps',sided:true,band:'FE002 長彈力繩：固定在胸口高度、身體側邊',cues:['側對固定點站穩，雙手握繩在胸前','把手往前推直，停 2 秒再收回','身體不要被繩子拉轉——這就是核心在出力'],why:'抗旋轉核心，保護腰椎最實用的練法'},
  march:{name:'原地高抬腿踏步',emoji:'🚶',kind:'time',cues:['原地踏步，膝蓋抬到髖的高度','手臂一起擺動','想多流汗就加快速度'],why:'暖身＋提高心跳'},
  lowjack:{name:'無跳開合跳',emoji:'⭐',kind:'time',cues:['一腳往側邊踏出，雙手同時往上舉','左右交替，加快速度','不用跳，保護膝蓋與腰'],why:'低衝擊有氧'}
};

/* ===================== 示範影片與常見錯誤 ===================== */
// yt 可以是陣列：依難度 Lv1/Lv2/Lv3 給不同版本

/* ===================== 日期與統計 ===================== */
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
function dayMap(){ // date -> 'full' | 'quick'
  const m={};
  for(const l of S.logs){ if(!l.quick) m[l.date]='full'; else if(!m[l.date]) m[l.date]='quick'; }
  return m;
}
function stats(){
  const m=dayMap(), now=new Date();
  let cur=0, d=m[dkey(now)]?now:addDays(now,-1);
  while(m[dkey(d)]){ cur++; d=addDays(d,-1); }
  const days=Object.keys(m).sort(); let longest=0, run=0, prev=null;
  for(const k of days){ const dt=new Date(k+'T00:00'); run = prev && dkey(addDays(prev,1))===k ? run+1 : 1; longest=Math.max(longest,run); prev=dt; }
  const pains=S.logs.filter(l=>l.pain);
  let painHalved=false;
  if(pains.length>=6){
    const avg=a=>a.reduce((s,l)=>s+l.pain.back+l.pain.hip,0)/a.length;
    const first=avg(pains.slice(0,3)), last=avg(pains.slice(-3));
    painHalved = first>=2 && last<=first/2;
  }
  return {streak:cur,longest,total:S.logs.length,minutes:S.logs.reduce((s,l)=>s+(l.min||0),0),maxLevel:S.settings.maxLevel,painHalved,days:m};
}

function scaled(it,lv){
  const mult=LEVELS[lv].mult;
  if(it.reps) return {reps:Math.round(it.reps*mult)};
  return {sec:Math.max(10,Math.round(it.sec*mult/5)*5)};
}
function buildSteps(rid,lv){
  const R=ROUTINES[rid], out=[];
  for(const b of R.blocks){
    const rounds=b.rounds||1;
    for(let r=1;r<=rounds;r++) for(const it of b.items){
      const ex=EX[it.ex], sets=it.sets||1, amt=scaled(it,lv);
      for(let s=1;s<=sets;s++) for(const side of ex.sided?['左邊','右邊']:[null]){
        out.push({kind:ex.kind,ex:it.ex,reps:amt.reps,sec:amt.sec,set:s,sets,side,round:r,rounds,uid:it});
      }
    }
  }
  // 插入休息
  const steps=[{kind:'rest',sec:5,label:'準備開始',next:out[0]}];
  out.forEach((st,i)=>{
    steps.push(st);
    const nx=out[i+1]; if(!nx) return;
    let sec=10,label='休息';
    if(nx.uid===st.uid && nx.set===st.set && nx.round===st.round){ sec=5; label='換邊'; }
    else if(nx.uid===st.uid){ sec=15; label='組間休息'; }
    steps.push({kind:'rest',sec,label,next:nx});
  });
  return steps;
}
function stepSeconds(st){
  if(st.kind==='reps'){ const ex=EX[st.ex]; return st.reps*(ex.hold?ex.hold+2:3)+4; }
  return st.sec;
}
const estMin=steps=>Math.max(1,Math.round(steps.reduce((s,x)=>s+stepSeconds(x),0)/60));
function amtText(st){ return st.reps ? `${st.reps} 下` : `${st.sec} 秒`; }
function planLines(rid,lv){
  const R=ROUTINES[rid], lines=[];
  for(const b of R.blocks){
    const head = b.rounds>1 ? `【循環 ${b.rounds} 輪】` : '';
    b.items.forEach((it,j)=>{
      const ex=EX[it.ex], a=scaled(it,lv);
      let t=(a.reps?`${a.reps} 下`:`${a.sec} 秒`)+(ex.hold?`（每下停 ${ex.hold} 秒）`:'');
      if(ex.sided) t+=' ・左右各一';
      if(it.sets>1) t+=` × ${it.sets} 組`;
      lines.push(`${j===0?head:''}${ex.emoji} ${ex.name}<span class="amt">　${t}</span>`);
    });
  }
  return lines;
}

}
function painOk(){
  const p=S.logs.filter(l=>l.pain).slice(-5);
  if(p.length<2) return true;
  return p[p.length-1].pain.back+p[p.length-1].pain.hip <= p[0].pain.back+p[0].pain.hip;
}
function setLevel(i){ S.settings.level=i; S.settings.maxLevel=Math.max(S.settings.maxLevel,i); save(); renderHome(); }
function weekStrip(m){
  const now=new Date(), mon=addDays(now,-((now.getDay()+6)%7)); let h='';
  for(let i=0;i<7;i++){ const d=addDays(mon,i), k=dkey(d), v=m[k];
    h+=`<div><div class="d">${WD[d.getDay()]}</div><div class="dot ${v==='full'?'done':v==='quick'?'quick':''} ${k===dkey(now)?'today':''}">${v?'✓':ROUTINES[WEEK[d.getDay()]].emoji}</div></div>`; }
  return h;
}
function calBase(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth()+calOffset,1); }
function calTitle(){ const b=calBase(); return `${b.getFullYear()} 年 ${b.getMonth()+1} 月`; }
function calendar(m){
  const b=calBase(), first=(b.getDay()+6)%7, days=new Date(b.getFullYear(),b.getMonth()+1,0).getDate(), tk=dkey(new Date());
  let h=['一','二','三','四','五','六','日'].map(x=>`<div class="h">${x}</div>`).join('');
  for(let i=0;i<first;i++) h+='<div class="c empty"></div>';
  for(let d=1;d<=days;d++){ const k=dkey(new Date(b.getFullYear(),b.getMonth(),d)), v=m[k];
    h+=`<div class="c ${v==='full'?'done':v==='quick'?'quick':''} ${k===tk?'today':''}">${d}</div>`; }
  return h;
}
function trend(){
  const p=S.logs.filter(l=>l.pain).slice(-20);
  if(p.length<2) return `<p class="small muted" style="margin:0">每次練完記錄一下腰和屁股的痠痛程度（0～10），累積幾次後這裡會畫出趨勢，看得到自己在進步。</p>`;
  const W=300,H=110,px=i=>10+i*(W-20)/(p.length-1),py=v=>H-8-v*(H-16)/10;
  const line=(f,c)=>`<polyline fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" points="${p.map((l,i)=>`${px(i)},${py(f(l))}`).join(' ')}"/>`+p.map((l,i)=>`<circle cx="${px(i)}" cy="${py(f(l))}" r="3" fill="${c}"/>`).join('');
  return `<svg class="trend" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="0" x2="${W}" y1="${py(5)}" y2="${py(5)}" stroke="var(--line)" stroke-dasharray="4 4"/>
    ${line(l=>l.pain.back,'var(--fire)')}${line(l=>l.pain.hip,'var(--rest)')}</svg>
    <div class="legend"><span><i style="background:var(--fire)"></i>腰／尾椎</span><span><i style="background:var(--rest)"></i>屁股外側</span><span>最近 ${p.length} 次，越低越好</span></div>`;
}
function exportData(){
  const t=JSON.stringify(S), ta=document.getElementById('bk'); ta.value=t;
  try{ navigator.clipboard.writeText(t).then(()=>alert('已複製備份，貼到記事本或傳給自己保存')); }catch(e){ ta.select(); }
}
function importData(){
  try{ const d=JSON.parse(document.getElementById('bk').value); if(!Array.isArray(d.logs)) throw 0;
    if(!confirm(`要用備份覆蓋目前紀錄嗎？（備份內有 ${d.logs.length} 筆）`)) return;
    S=d; S.settings=Object.assign({level:0,sound:true,voice:true,video:true,maxLevel:0,noticeOk:true},S.settings||{}); save(); renderHome(); alert('還原完成');
  }catch(e){ alert('備份文字格式不對'); }
}

/* ===================== 音效 / 語音 / 螢幕常亮 ===================== */
let actx=null, wakeLock=null;
function beep(f=880,d=.12){
  if(!S.settings.sound) return;
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume();
    const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
    o.frequency.value=f; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(.3,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.start(t); o.stop(t+d);
  }catch(e){}
}
function say(t){
  if(!S.settings.voice||!('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='zh-TW'; u.rate=1.05; speechSynthesis.speak(u); }catch(e){}
}
async function keepAwake(on){
  try{
    if(on && 'wakeLock' in navigator){ wakeLock=await navigator.wakeLock.request('screen'); }
    else if(!on && wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(W && document.visibilityState==='visible') keepAwake(true); });

/* ===================== 訓練流程 ===================== */
let W=null, timer=null;
const $=id=>document.getElementById(id);
const ARC=276.46;
function startWorkout(rid){
  beep(660,.05); // 解鎖 iOS 音效
  const lv=S.settings.level;
  W={rid,lv,steps:buildSteps(rid,lv),i:0,startedAt:Date.now(),running:false,endAt:0,left:0,paused:false};
  $('ov').classList.add('show'); $('wStage').hidden=false; $('wDone').hidden=true;
  document.body.style.overflow='hidden';
  keepAwake(true);
  enter(0);
  clearInterval(timer); timer=setInterval(tick,200);
}
function stepTitle(st){ return `${EX[st.ex].name}${st.side?'・'+st.side:''}`; }
function enter(i){
  W.i=i; const st=W.steps[i]; W.paused=false;
  if(st.kind==='reps'){ W.running=false; }
  else { W.running=true; W.total=st.sec; W.endAt=Date.now()+st.sec*1000; W.left=st.sec; }
  if(st.kind==='rest'){
    say(i===0?`準備，第一個動作：${stepTitle(st.next)}`:`${st.label}，下一個：${stepTitle(st.next)}`);
  } else {
    say(`${stepTitle(st)}，${amtText(st)}`);
    beep(990,.15);
  }
  render();
}
function tick(){
  if(!W||!W.running||W.paused) return;
  const ms=W.endAt-Date.now(), left=Math.ceil(ms/1000);
  if(left!==W.left){ W.left=left; if(left>0&&left<=3) beep(left===1?880:660,.1); if(navigator.vibrate&&left===0) navigator.vibrate(200); }
  if(ms<=0){ beep(1200,.3); next(); return; }
  renderTimer(ms);
}
function next(){ if(W.i+1>=W.steps.length) finish(); else enter(W.i+1); }
function prev(){
  let j=W.i-1; while(j>0 && W.steps[j].kind==='rest') j--;
  enter(Math.max(0,j));
}
function togglePause(){
  if(W.paused){ W.endAt=Date.now()+W.pausedMs; W.paused=false; }
  else { W.pausedMs=W.endAt-Date.now(); W.paused=true; }
  render();
}
function renderTimer(ms){
  const frac=Math.max(0,ms)/(W.total*1000);
  $('wArc').style.strokeDashoffset=String(ARC*(1-frac));
  $('wNum').textContent=Math.max(0,Math.ceil(ms/1000));
}
function render(){
  const st=W.steps[W.i], work=W.steps.filter(s=>s.kind!=='rest').length;
  const doneWork=W.steps.slice(0,W.i).filter(s=>s.kind!=='rest').length;
  $('wBar').style.width=(W.i/(W.steps.length-1)*100)+'%';
  $('wCount').textContent=`${Math.min(work,doneWork+(st.kind==='rest'?0:1))}/${work}`;
  const isRest=st.kind==='rest', ex=EX[isRest?st.next.ex:st.ex], ref=isRest?st.next:st;
  $('wRing').classList.toggle('rest',isRest);
  $('wKicker').textContent=isRest?`${st.label} ・ 下一個`:(ref.rounds>1?`第 ${ref.round}/${ref.rounds} 輪`:'');
  $('wName').textContent=`${ex.emoji} ${ex.name}`;
  const meta=[];
  if(ref.side) meta.push(ref.side);
  if(ref.sets>1) meta.push(`第 ${ref.set}/${ref.sets} 組`);
  if(ex.variants) meta.push(ex.variants[W.lv]);
  if(isRest) meta.push(amtText(ref));
  if(ex.hold) meta.push(`每下停 ${ex.hold} 秒`);
  $('wMeta').innerHTML=meta.map(m=>`<span class="tag">${m}</span>`).join('');
  if(st.kind==='reps'){
    $('wArc').style.strokeDashoffset='0';
    $('wNum').textContent=st.reps; $('wUnit').textContent='下';
    $('wMain').textContent='完成 ✓ 下一個'; $('wMain').className='main';
  } else {
    $('wUnit').textContent=isRest?'秒後開始':'秒';
    renderTimer(W.paused?W.pausedMs:W.endAt-Date.now());
    $('wMain').textContent=W.paused?'▶ 繼續':'⏸ 暫停';
    $('wMain').className='main'+(isRest?' restbtn':'');
  }
  $('wSkip').textContent=isRest?'開始 ⏭':'跳過 ⏭';
  $('wPrev').disabled=W.i===0;
  if(ex.band){ $('wBand').hidden=false; $('wBand').textContent='🎗️ '+ex.band; } else $('wBand').hidden=true;
  $('wCues').innerHTML=ex.cues.map(c=>`<li>${c}</li>`).join('')+(ex.why?`<li style="background:var(--brand-soft)">${ex.why}</li>`:'');
  const bad=BAD[isRest?st.next.ex:st.ex]||[];
  $('wBadHead').hidden=!bad.length; $('wBad').innerHTML=bad.map(c=>`<li>${c}</li>`).join('');
  renderVideo(isRest?st.next.ex:st.ex);
  const nx=W.steps.slice(W.i+1).find(s=>s.kind!=='rest');
  $('wNext').textContent=isRest?'':(nx?`接下來：${EX[nx.ex].emoji} ${stepTitle(nx)}`:'這是最後一個動作，加油！');
}
// 同一支影片（例如換邊、下一組）不重新載入，避免一直重播
function renderVideo(exId){
  const d=DEMO[exId], box=$('wVid'), id=d?pickLv(d.yt,W.lv):null;
  $('wRing').classList.toggle('compact',!!id);
  if(!id){ box.innerHTML=''; W.vid=null; return; }
  if(W.vid===id) return;
  W.vid=id;
  const name=EX[exId].name, by=pickLv(d.by,W.lv);
  const foot=`<div class="src"><span>示範：${by}</span><a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">在 YouTube 開啟 ↗</a></div>`;
  if(S.settings.video) box.innerHTML=`<div class="frame">${iframe(id)}</div>${foot}`;
  else box.innerHTML=`<button class="load" onclick="this.outerHTML='<div class=\\'frame\\'>'+iframe('${id}')+'</div>'">▶ 看「${name}」示範影片</button>${foot}`;
}
function iframe(id){
  const q=`autoplay=1&mute=1&playsinline=1&loop=1&playlist=${id}&rel=0&modestbranding=1`;
  return `<iframe src="https://www.youtube-nocookie.com/embed/${id}?${q}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="示範影片"></iframe>`;
}
function stopWorkout(){
  clearInterval(timer); W=null; keepAwake(false); $('wVid').innerHTML='';
  try{ speechSynthesis.cancel(); }catch(e){}
  $('ov').classList.remove('show'); document.body.style.overflow='';
  renderHome();
}
function finish(){
  clearInterval(timer);
  const R=ROUTINES[W.rid], min=Math.max(1,Math.round((Date.now()-W.startedAt)/60000));
  const before=stats();
  const log={date:dkey(new Date()),ts:Date.now(),routine:W.rid,min,level:W.lv,quick:!!R.quick};
  S.logs.push(log); save();
  const after=stats();
  const newBadges=BADGES.filter(b=>b.ok(after)&&!b.ok(before));
  keepAwake(false);
  say('完成！太棒了');
  $('wStage').hidden=true;
  const d=$('wDone'); d.hidden=false;
  d.innerHTML=`<div class="big">🎉</div><h2>${R.name} 完成！</h2>
    <p>${CHEERS[Math.floor(Math.random()*CHEERS.length)]}</p>
    <div class="pill" style="font-size:18px">🔥 連續 ${after.streak} 天</div>
    ${newBadges.length?`<div class="card" style="margin-top:14px"><b>獲得新徽章！</b><div class="badges" style="margin-top:8px">${newBadges.map(b=>`<div class="badge got"><span class="i">${b.i}</span>${b.n}</div>`).join('')}</div></div>`:''}
    <div class="pain card">
      <b>現在的痠痛程度？</b> <span class="small muted">（0 = 完全不痠，10 = 非常痛）</span>
      <label>腰／尾椎附近 <span class="v" id="pbv">2</span></label>
      <input type="range" min="0" max="10" value="2" id="pb" oninput="$('pbv').textContent=this.value">
      <label>屁股上緣外側 <span class="v" id="phv">2</span></label>
      <input type="range" min="0" max="10" value="2" id="ph" oninput="$('phv').textContent=this.value">
    </div>
    <button class="btn" onclick="savePain(${log.ts})">記錄並回首頁</button>
    <button class="btn ghost" style="margin-top:10px" onclick="stopWorkout()">略過</button>`;
  confetti();
}
function savePain(ts){
  const l=S.logs.find(x=>x.ts===ts);
  if(l){ l.pain={back:+$('pb').value,hip:+$('ph').value}; save(); }
  stopWorkout();
}
function confetti(){
  const box=document.createElement('div'); box.className='confetti';
  const em=['🎉','✨','💪','🔥','⭐','🟢','🟡','🔵'];
  for(let i=0;i<50;i++){ const s=document.createElement('span'); s.textContent=em[i%em.length];
    s.style.left=Math.random()*100+'vw'; s.style.animationDuration=(1.8+Math.random()*1.8)+'s'; s.style.animationDelay=(Math.random()*.6)+'s'; box.appendChild(s); }
  document.body.appendChild(box); setTimeout(()=>box.remove(),4500);
}
$('wMain').onclick=()=>{ const st=W.steps[W.i]; if(st.kind==='reps') next(); else togglePause(); };
$('wSkip').onclick=()=>next();
$('wPrev').onclick=()=>prev();
$('wQuit').onclick=()=>{ if(confirm('要結束嗎？沒做完不會記錄到今天的成績喔')) stopWorkout(); };

renderHome();
</script>
